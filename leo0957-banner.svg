<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" role="img" aria-labelledby="title desc">
<title id="title">Profil GitHub de Léo</title>
<desc id="desc">Bannière sombre et moderne présentant Léo, développeur Full-Stack et étudiant en BTS SIO SLAM.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07101b"/>
    <stop offset="0.58" stop-color="#081729"/>
    <stop offset="1" stop-color="#060c14"/>
  </linearGradient>
  <radialGradient id="glow" cx="67%" cy="26%" r="60%">
    <stop offset="0" stop-color="#147dff" stop-opacity=".17"/>
    <stop offset="1" stop-color="#147dff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#5e8fc5" stroke-opacity=".08" stroke-width="1"/>
  </pattern>
  <clipPath id="photoClip"><rect x="58" y="54" width="412" height="534" rx="34"/></clipPath>
  <linearGradient id="photoShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0.55" stop-color="#06101d" stop-opacity="0"/>
    <stop offset="1" stop-color="#06101d" stop-opacity=".92"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
  </filter>
</defs>
<rect width="1200" height="642" fill="url(#bg)"/>
<rect width="1200" height="642" fill="url(#glow)"/>
